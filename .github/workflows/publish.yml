name: Publish .NET SDK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GIT__TOKEN || secrets.GH__TOKEN || github.token }}

      - name: Prepare version
        id: version
        run: |
          set -euo pipefail

          versions_file="$(mktemp)"
          git fetch --tags --force

          git tag --list 'v[0-9]*.[0-9]*.[0-9]*' |
            sed -E 's/^v//' |
            awk '/^[0-9]+\.[0-9]+\.[0-9]+$/ { print }' >> "${versions_file}"

          nuget_response="$(mktemp)"
          if curl -fsSL "https://api.nuget.org/v3-flatcontainer/leadping.openapiclient/index.json" -o "${nuget_response}"; then
            python3 - "${nuget_response}" <<'PY' >> "${versions_file}"
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              data = json.load(handle)

          for version in data.get("versions", []):
              if re.fullmatch(r"\d+\.\d+\.\d+", version):
                  print(version)
          PY
          fi

          version="$(python3 - "${versions_file}" <<'PY'
          import re
          import sys

          best = None
          with open(sys.argv[1], encoding="utf-8") as handle:
              for line in handle:
                  version = line.strip()
                  if not re.fullmatch(r"\d+\.\d+\.\d+", version):
                      continue

                  parsed = tuple(int(part) for part in version.split("."))
                  if best is None or parsed > best:
                      best = parsed

          if best is None:
              print("1.0.0")
          else:
              major, minor, patch = best
              print(f"{major}.{minor}.{patch + 1}")
          PY
          )"

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3."
            exit 1
          fi

          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${tag} already exists."
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.x"

      - name: Restore
        run: dotnet restore Leadping.OpenApiClient.csproj

      - name: Pack
        run: |
          dotnet pack Leadping.OpenApiClient.csproj \
            --configuration Release \
            --no-restore \
            --output artifacts \
            -p:PackageVersion="${{ steps.version.outputs.version }}" \
            -p:ContinuousIntegrationBuild=true

      - name: NuGet trusted publishing login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: leadpingai

      - name: Publish to NuGet.org
        run: |
          set -euo pipefail

          for package in artifacts/*.nupkg; do
            dotnet nuget push "${package}" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --skip-duplicate
          done

      - name: Publish to GitHub Packages
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GH__TOKEN || secrets.GIT__TOKEN || github.token }}
        run: |
          set -euo pipefail

          for package in artifacts/*.nupkg; do
            dotnet nuget push "${package}" \
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
              --api-key "${GITHUB_PACKAGES_TOKEN}" \
              --skip-duplicate
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GH__TOKEN || secrets.GIT__TOKEN || github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          GIT_EMAIL: ${{ secrets.GIT__EMAIL || 'support@leadping.ai' }}
        run: |
          set -euo pipefail

          git config user.name "leadpingai-bot"
          git config user.email "${GIT_EMAIL}"
          git tag "${TAG}"
          git push origin "${TAG}"

          gh release create "${TAG}" artifacts/* \
            --title "${TAG}" \
            --notes "Generated Leadping .NET SDK ${TAG}."
